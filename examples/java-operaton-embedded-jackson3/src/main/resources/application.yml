server:
  port: 8083

spring:
  application:
    name: Java Operaton Embedded Jackson 3

springdoc:
  swagger-ui:
    try-it-out-enabled: true

dev:
  bpm-crafters:
    process-api:
      adapter:
        operaton-embedded:
          enabled: true
          service-tasks:
            delivery-strategy: embedded_scheduled
            worker-id: embedded-worker
            lock-time-in-seconds: 10
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
            retries: 3
            max-task-count: 100
            retry-timeout-in-seconds: 30
          user-tasks:
            delivery-strategy: embedded_scheduled
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
operaton:
  bpm:
    webapp:
      index-redirect-enabled: false
    admin-user:
      id: admin
      password: admin
    filter:
      create: All
    auto-deployment-enabled: false

logging:
  level:
    dev.bpmcrafters.processengineapi: INFO
    dev.bpmcrafters.processengineapi.adapter.operaton.embedded.springboot: INFO
